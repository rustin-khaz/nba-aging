name: tests

on:
  push:
  pull_request:

jobs:
  model-tests:
    # The data checks (test_pipeline.py) need the 55 MB download, so CI runs the model
    # checks, which build simulated players with a known aging curve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest test_models.py -v
